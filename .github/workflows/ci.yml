name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck on scripts
        run: shellcheck scripts/*.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: personal-knowledge:ci
          cache-from: type=gha,scope=ci
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ci' || '' }}

      - name: Smoke test bundled scripts in container
        run: |
          docker run --rm --entrypoint bash personal-knowledge:ci -c \
            'command -v bash python3 tar && basic-memory --help >/dev/null && python3 -c "import socket" && backup.sh --help && restore.sh --help && verify-backup.sh --help'

      - name: Smoke test MCP server startup with fresh volume
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f basic-memory-ci >/dev/null 2>&1 || true
            docker volume rm basic-memory-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name basic-memory-ci \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:48091:8000 \
            -v basic-memory-ci-data:/data \
            personal-knowledge:ci
          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:48091/mcp"
          payload = json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-03-26",
                  "capabilities": {},
                  "clientInfo": {"name": "ci-smoke", "version": "0.1"},
              },
          }).encode()
          last_err = None
          for _ in range(60):
              try:
                  req = urllib.request.Request(
                      url,
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json, text/event-stream",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=3) as resp:
                      assert resp.status == 200, f"unexpected status: {resp.status}"
                      print("MCP initialize OK:", resp.status)
                      raise SystemExit(0)
              except Exception as err:
                  last_err = err
                  time.sleep(0.5)
          raise SystemExit(f"MCP server did not become ready: {last_err}")
          PY
